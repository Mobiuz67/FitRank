name: Build FitRank APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract FitRank project ZIP
    run: |
      unzip -o FitRank-GitHub-Actions-Ready.zip -d .
      if [ -f FitRank-GitHub-Actions-Ready/app.zip ]; then
        unzip -o FitRank-GitHub-Actions-Ready/app.zip -d FitRank-GitHub-Actions-Ready
      fi
      find . -maxdepth 3 -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Build APK
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FitRank-debug-APK
      path: app/build/outputs/apk/debug/app-debug.apk
